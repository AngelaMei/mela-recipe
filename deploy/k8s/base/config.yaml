apiVersion: v1
kind: ConfigMap
metadata:
  name: mela-config
data:
  POSTGRES_HOST: mela-postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: mela
  POSTGRES_USER: mela
  MELA_HOUSEHOLD: "Mei & Paul"
  MELA_HOUSEHOLD_ZH: "Mei 與 Paul"
  # Comma-separated. Add "|中文名稱" after a name to show a different name in Chinese.
  MELA_MEMBERS: "Mei,Paul"
  COOKIE_SECURE: "true"
