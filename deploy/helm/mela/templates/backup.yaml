{{- if .Values.backup.enabled }}
# Nightly pg_dump to its own volume. Copy these off-cluster too if your volumes aren't backed up.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mela-backups
  labels:
    {{- include "mela.labels" . | nindent 4 }}
  annotations:
    # Keep the backups even if the release is uninstalled
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.backup.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backup.storage }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mela-backup
  labels:
    {{- include "mela.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mela-backup
            app.kubernetes.io/part-of: mela
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: {{ .Values.postgres.image }}
              command:
                - sh
                - -c
                - |
                  set -e
                  f=/backups/mela-$(date +%Y%m%d-%H%M).sql.gz
                  pg_dump -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" | gzip > "$f"
                  find /backups -name 'mela-*.sql.gz' -mtime +{{ .Values.backup.retentionDays }} -delete
                  ls -lh /backups
              env:
                - name: POSTGRES_HOST
                  valueFrom: { configMapKeyRef: { name: mela-config, key: POSTGRES_HOST } }
                - name: POSTGRES_DB
                  valueFrom: { configMapKeyRef: { name: mela-config, key: POSTGRES_DB } }
                - name: POSTGRES_USER
                  valueFrom: { configMapKeyRef: { name: mela-config, key: POSTGRES_USER } }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: POSTGRES_PASSWORD } }
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: mela-backups
{{- end }}
