apiVersion: v1
kind: Service
metadata:
  name: mela-api
  labels:
    app.kubernetes.io/name: mela-api
spec:
  selector:
    app.kubernetes.io/name: mela-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mela-api
  labels:
    app.kubernetes.io/name: mela-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mela-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mela-api
        app.kubernetes.io/part-of: mela
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      initContainers:
        # Waits for Postgres, then applies migrations.
        - name: migrate
          image: mela-api
          command: ["sh", "-c", "python -m app.wait_db && alembic upgrade head"]
          envFrom:
            - configMapRef: { name: mela-config }
            - secretRef: { name: mela-secrets }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
      containers:
        - name: api
          image: mela-api
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef: { name: mela-config }
            - secretRef: { name: mela-secrets }
          readinessProbe:
            httpGet: { path: /api/readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
