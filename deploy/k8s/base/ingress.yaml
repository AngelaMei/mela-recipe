# /api -> FastAPI, everything else -> Next.js. Same origin, so the session cookie just works.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mela
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"   # photo uploads
spec:
  ingressClassName: nginx
  rules:
    - host: mela.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: mela-api, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: mela-web, port: { name: http } }
  tls:
    - hosts: [mela.example.com]
      secretName: mela-tls
