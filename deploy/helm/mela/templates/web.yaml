apiVersion: v1
kind: Service
metadata:
  name: mela-web
  labels:
    app.kubernetes.io/name: mela-web
    {{- include "mela.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: mela-web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mela-web
  labels:
    app.kubernetes.io/name: mela-web
    {{- include "mela.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mela-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mela-web
        app.kubernetes.io/part-of: mela
    spec:
      {{- include "mela.pullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: web
          image: {{ include "mela.image" (list . .Values.image.web) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: { path: /manifest.webmanifest, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /manifest.webmanifest, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
