apiVersion: v1
kind: ConfigMap
metadata:
  name: mela-config
  labels:
    {{- include "mela.labels" . | nindent 4 }}
data:
  POSTGRES_HOST: mela-postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: mela
  POSTGRES_USER: mela
  MELA_HOUSEHOLD: {{ .Values.household.name | quote }}
  MELA_HOUSEHOLD_ZH: {{ .Values.household.nameZh | quote }}
  MELA_MEMBERS: {{ .Values.household.members | quote }}
  COOKIE_SECURE: "true"
