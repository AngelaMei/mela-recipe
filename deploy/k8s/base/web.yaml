apiVersion: v1
kind: Service
metadata:
  name: mela-web
  labels:
    app.kubernetes.io/name: mela-web
spec:
  selector:
    app.kubernetes.io/name: mela-web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mela-web
  labels:
    app.kubernetes.io/name: mela-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mela-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mela-web
        app.kubernetes.io/part-of: mela
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: web
          image: mela-web
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: { path: /manifest.webmanifest, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /manifest.webmanifest, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
