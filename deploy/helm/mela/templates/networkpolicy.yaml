{{- if .Values.networkPolicy.enabled }}
# Only the API (and the backup job) may talk to Postgres.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mela-postgres
  labels:
    {{- include "mela.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mela-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mela-api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mela-backup
      ports:
        - port: 5432
{{- end }}
