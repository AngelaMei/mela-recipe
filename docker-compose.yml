# Local development: docker compose up --build  ->  http://localhost:3000  (passcode 1234)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mela
      POSTGRES_USER: mela
      POSTGRES_PASSWORD: mela
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mela -d mela"]
      interval: 5s
      retries: 10

  mela-api:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: mela
      MELA_PASSCODE: "1234"
      SESSION_SECRET: local-dev-secret-not-for-prod
      COOKIE_SECURE: "false"
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  mela-web:
    build:
      context: ./web
      args:
        API_INTERNAL_URL: http://mela-api:8000
    ports:
      - "3000:3000"
    depends_on:
      - mela-api

volumes:
  pgdata:
